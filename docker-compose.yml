version: "3.9"

# ============================================================================
# Finance Lab — Docker Compose
# ============================================================================

services:
  # ── PostgreSQL — Historical data & experiment results ──────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_lab
      POSTGRES_USER: finlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finlab_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finlab -d finance_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — Real-time state & pub/sub ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend — FastAPI + Simulation Engines ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finlab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://finlab:${POSTGRES_PASSWORD:-finlab_secret_2024}@postgres:5432/finance_lab
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./core:/app/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info

  # ── Frontend — Next.js Dashboard ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finlab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
