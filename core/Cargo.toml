[package]
name = "finlab-core"
version = "0.1.0"
edition = "2021"
description = "High-performance computation core for Finance Lab"

[lib]
name = "finlab_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ordered-float = "4.2"
crossbeam = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
